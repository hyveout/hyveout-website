<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>HYVEOUT</title>
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">
<meta property="og:title" content="HYVEOUT">
<meta name="twitter:title" content="HYVEOUT">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-screen="hub">

<div id="glows"></div>
<div class="world">
  <div class="grid"></div>
  <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
</div>

<div class="boot" id="boot">
  <div class="inner">
    <div class="word">HYVEOUT</div>
    <button class="enter" id="enterBtn">&gt;ENTER&lt;</button>
  </div>
</div>

<div class="crt"></div>
<div class="crt-dim"></div>
<div class="crumbs" id="crumbs"></div>
<div id="screens"></div>

<div class="emblem-wrap" id="emblemWrap" style="opacity:0" aria-label="Hyveout logo. Drag to spin. Tap to go back.">
  <div class="emblem-float">
    <div class="emblem-glow"></div>
    <div class="emblem-idle">
      <div class="emblem" id="emblem"><div class="face"></div><div class="face back"></div></div>
    </div>
    <div class="emblem-shadow"></div>
  </div>
</div>

<div class="prompts">
  <div class="prompt b" id="promptB"><span class="key">B</span>BACK</div>
  <div class="prompt a" id="promptA"><span class="key">A</span>SELECT</div>
</div>
<div class="footer"><span>©</span><span class="y">2026</span><span class="h">HYVEOUT</span></div>

<script src="js/app.js"></script>
</body>
</html>
